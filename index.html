<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çağan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300;1,9..144,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #08070c;
    --fg: #f5f2ec;
    --accent: #ff6a3d;
    --accent-2: #8b6bff;
    --accent-3: #3dd6c8;
    --muted: #8b879a;
    --line: rgba(245,242,236,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    cursor: default;
  }

  canvas#bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    width: 100%;
    height: 100%;
  }

  .grain {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.05;
    mix-blend-mode: overlay;
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
  }

  main {
    position: relative;
    z-index: 3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2rem 1.5rem;
  }

  .reveal {
    opacity: 0;
    transform: translateY(18px);
    animation: rise 1s cubic-bezier(.16,1,.3,1) forwards;
  }
  .reveal:nth-child(1) { animation-delay: 0.05s; }
  .reveal:nth-child(2) { animation-delay: 0.18s; }
  .reveal:nth-child(3) { animation-delay: 0.34s; }
  .reveal:nth-child(4) { animation-delay: 0.5s; }
  .reveal:nth-child(5) { animation-delay: 0.66s; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 1.6rem;
  }

  .eyebrow::before,
  .eyebrow::after {
    content: '';
    width: 24px;
    height: 1px;
    background: var(--line);
  }

  h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(3.2rem, 13vw, 8rem);
    line-height: 1.05;
    background: linear-gradient(115deg, var(--fg) 20%, var(--accent) 55%, var(--accent-2) 85%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.01em;
    animation: rise 1s cubic-bezier(.16,1,.3,1) forwards, shine 8s ease-in-out infinite;
    animation-delay: 0.18s, 1s;
  }

  @keyframes shine {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .tagline {
    margin-top: 1.5rem;
    font-size: clamp(1rem, 2.1vw, 1.3rem);
    font-weight: 300;
    color: #d4d0e0;
    max-width: 32rem;
    line-height: 1.6;
  }

  .divider {
    margin: 2.4rem auto;
    width: 44px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line), transparent);
  }

  .bio {
    max-width: 36rem;
    font-size: 1rem;
    font-weight: 300;
    line-height: 1.85;
    color: var(--muted);
  }

  .contact {
    margin-top: 2.8rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .contact a {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.85rem 1.5rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    color: var(--fg);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(10px);
    overflow: hidden;
    transition: border-color 0.35s ease, transform 0.35s ease, box-shadow 0.35s ease;
  }

  .contact a::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    opacity: 0;
    transition: opacity 0.35s ease;
    z-index: -1;
  }

  .contact a:hover {
    border-color: transparent;
    transform: translateY(-3px);
    box-shadow: 0 12px 30px -10px rgba(255,106,61,0.45);
  }

  .contact a:hover::before {
    opacity: 1;
  }

  .contact svg {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
  }

  footer {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 2.4rem 1rem 3rem;
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #4d4a5c;
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="vignette"></div>
<svg class="grain" width="100%" height="100%">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence>
    <feColorMatrix type="saturate" values="0"></feColorMatrix>
  </filter>
  <rect width="100%" height="100%" filter="url(#noise)"></rect>
</svg>

<main>
  <div class="eyebrow reveal">Hakkımda</div>
  <h1 class="reveal">Çağan</h1>
  <p class="tagline reveal">Yaratıcı işler yapan, fikirleri hayata geçirmeyi seven biriyim.</p>

  <div class="divider reveal"></div>

  <p class="bio reveal">
    Şu anda Exposure AI Academy'de öğrenciyim; yapay zeka ve yaratıcı teknolojiler
    üzerine kendimi geliştiriyorum. Fikirleri hayata geçirmeyi ve yeni şeyler
    öğrenmeyi seviyorum.
  </p>

  <div class="contact reveal">
    <a href="tel:+905055573436">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      505 557 34 36
    </a>
    <a href="https://instagram.com/caganbaris36" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
      @caganbaris36
    </a>
  </div>
</main>

<footer>© 2026 Çağan</footer>

<script>
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let w, h, mx = 0.5, my = 0.5;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', (e) => {
    mx = e.clientX / w;
    my = e.clientY / h;
  });
  resize();

  const blobs = [
    { x: 0.22, y: 0.28, r: 340, s: 0.55, color: 'rgba(255,106,61,0.32)' },
    { x: 0.78, y: 0.65, r: 400, s: 0.4,  color: 'rgba(139,107,255,0.32)' },
    { x: 0.5,  y: 0.85, r: 300, s: 0.6,  color: 'rgba(61,214,200,0.16)' },
    { x: 0.85, y: 0.15, r: 220, s: 0.5,  color: 'rgba(255,255,255,0.05)' },
  ];

  const colors = ['rgba(255,106,61,0.9)', 'rgba(139,107,255,0.9)', 'rgba(61,214,200,0.9)', 'rgba(245,242,236,0.7)'];
  const particles = Array.from({ length: 60 }, () => ({
    x: Math.random() * w,
    y: Math.random() * h,
    r: Math.random() * 2 + 0.6,
    vx: (Math.random() - 0.5) * 0.25,
    vy: -Math.random() * 0.35 - 0.08,
    color: colors[Math.floor(Math.random() * colors.length)],
    twinkle: Math.random() * Math.PI * 2,
  }));

  let t = 0;
  function draw() {
    t += 0.0035;
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    ctx.filter = 'blur(70px)';

    blobs.forEach((b, i) => {
      const px = (mx - 0.5) * 40 * b.s;
      const py = (my - 0.5) * 40 * b.s;
      const x = (b.x + Math.sin(t * b.s + i * 2) * 0.06) * w + px;
      const y = (b.y + Math.cos(t * b.s + i * 1.7) * 0.06) * h + py;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, b.r);
      grad.addColorStop(0, b.color);
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, b.r, 0, Math.PI * 2);
      ctx.fill();
    });

    ctx.filter = 'none';
    particles.forEach((p) => {
      p.x += p.vx;
      p.y += p.vy;
      p.twinkle += 0.05;

      if (p.y < -10) { p.y = h + 10; p.x = Math.random() * w; }
      if (p.x < -10) p.x = w + 10;
      if (p.x > w + 10) p.x = -10;

      const alpha = (Math.sin(p.twinkle) + 1) / 2 * 0.7 + 0.3;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    requestAnimationFrame(draw);
  }
  draw();
</script>

</body>
</html>
